[project]
name = "samplerbench"
version = "0.0.1"
description = "Evaluation library for ML molecular samplers beyond marginals"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
md = ["mdtraj", "deeptime"]
track = ["wandb"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samplerbench"]
